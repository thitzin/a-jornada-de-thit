    :root{--bg-darkest:#1e1f22;--bg-dark:#2b2d31;--bg-primary:#313338;--bg-elevated:#383a40;
      --bg-hover:rgba(78,80,88,.35);--bg-active:rgba(78,80,88,.6);--text-header:#f2f3f5;
      --text-normal:#dbdee1;--text-muted:#949ba4;--text-faint:#6d6f78;--text-link:#00a8fc;
      --brand:#5865f2;--border-subtle:#26272b;--border-soft:#3f4147;
      --font-ui:"gg sans","Segoe UI","Helvetica Neue",Arial,sans-serif;--font-code:Consolas,"Courier New",monospace;}
    *{box-sizing:border-box}html,body{height:100%;margin:0}
    body{font-family:var(--font-ui);background:var(--bg-darkest);color:var(--text-normal);overflow:hidden}
    ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--bg-darkest);border-radius:8px;border:2px solid var(--bg-primary)}
    #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
    #topbar{height:40px;min-height:40px;background:var(--bg-dark);border-bottom:1px solid var(--border-subtle);
      display:flex;align-items:center;justify-content:center;position:relative;padding:0 16px;font-weight:700;color:var(--text-header);font-size:15px;gap:10px}
    .topbar-logo-img{height:22px;width:auto;flex-shrink:0;border-radius:4px}
    #main-layout{flex:1;display:flex;min-height:0}
    #left-sidebar{width:288px;min-width:288px;background:var(--bg-dark);overflow-y:auto;padding:16px 8px}
    .sidebar-section-header{padding:0 8px 6px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-muted)}
    .chapters-list{list-style:none;margin:0;padding:0}
    .chapter-item{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:1px 0;border-radius:4px;
      color:var(--text-muted);font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chapter-item:hover{background:var(--bg-hover);color:var(--text-header)}
    .chapter-item.active{background:var(--bg-active);color:var(--text-header)}
    .chapter-hash{display:inline-flex;flex-shrink:0;width:18px;height:18px;color:#80848e}.chapter-hash svg{width:18px;height:18px;display:block}
    .category-header{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:14px 8px 4px 6px;
      font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text-muted);
      cursor:default;user-select:none}
    .category-chevron{display:inline-flex;flex-shrink:0;width:12px;height:12px}
    .category-chevron svg{width:12px;height:12px;display:block}
    #chat-area{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-primary)}
    #channel-header{height:48px;min-height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;
      border-bottom:1px solid var(--border-subtle);font-weight:700;color:var(--text-header)}
    .channel-hash{display:inline-flex;flex-shrink:0;width:24px;height:24px;color:#80848e}.channel-hash svg{width:24px;height:24px;display:block}
    #channel-topic{margin-left:8px;padding-left:12px;border-left:1px solid var(--border-soft);font-size:13px;font-weight:400;color:var(--text-muted)}
    .reader-messages{flex:1;overflow-y:auto;padding:16px 16px 48px;display:flex;flex-direction:column;overflow-anchor:none}
    .message-group{display:flex;gap:16px;padding:2px 8px;margin-top:17px;border-radius:4px}
    .message-group:first-child{margin-top:4px}
    .message-group-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--brand);
      display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;
      background-size:cover;background-position:center;background-repeat:no-repeat}
    /* clicável de verdade: cursor de "mãozinha" (não lupa) e nick sublinhado
       ao passar o mouse no nick OU no avatar do personagem */
    .message-group-avatar.zoomable, .message-author-name.zoomable{cursor:pointer}
    .message-group-avatar.zoomable, .message-author-name.zoomable, .avatar-lightbox, .avatar-lightbox img, .avatar-lightbox-close{
      -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;outline:none}
    .message-group-avatar.zoomable, .message-author-name.zoomable{user-select:none;-webkit-user-select:none}
    .message-author-name.zoomable:hover,
    .message-group:has(> .message-group-avatar.zoomable:hover) .message-author-name.zoomable,
    .illustration-block-attributed:has(> .message-group-avatar.zoomable:hover) .message-author-name.zoomable{text-decoration:underline}
    .message-group-body{flex:1;min-width:0}
    .message-group-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
    .message-author-name{font-size:16px;font-weight:600}
    .message-author-tag{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--brand);
      color:#fff;text-transform:uppercase;line-height:1.25}
    .episodes-list-label{padding:14px 6px 4px;font-size:12px;font-weight:700;letter-spacing:.02em;
      text-transform:uppercase;color:var(--text-header)}
    .message-content{font-size:16px;line-height:1.375rem;color:var(--text-normal);word-wrap:break-word;white-space:pre-wrap}
    .message-content strong{font-weight:700;color:var(--text-header)}
    .message-content em{font-style:italic}.message-content u{text-decoration:underline}.message-content s{text-decoration:line-through}
    .message-content a{color:var(--text-link);text-decoration:none}.message-content a:hover{text-decoration:underline}
    .message-content code.inline-code{background:var(--bg-darkest);border:1px solid var(--border-soft);padding:1px 4px;
      border-radius:3px;font-family:var(--font-code);font-size:.85em}
    .message-content pre.code-block{background:var(--bg-darkest);border:1px solid var(--border-soft);border-radius:4px;
      padding:10px 12px;margin:4px 0;overflow-x:auto}
    .message-content pre.code-block code{font-family:var(--font-code);font-size:.85em;white-space:pre}
    .message-content .subtext{display:inline;font-size:12px;color:var(--text-faint)}
    .message-content img.emoji{width:1.375em;height:1.375em;vertical-align:-0.28em;margin:0 .05em 0 .1em;object-fit:contain}
    .message-content.emoji-only{font-size:3.0rem;line-height:1.25}
    .message-content.emoji-only img.emoji{width:1em;height:1em;margin:0 .02em;vertical-align:-0.1em}
    .spoiler{background:var(--bg-elevated);color:transparent;border-radius:3px;cursor:pointer;padding:0 2px;user-select:none}
    .spoiler.revealed{background:var(--bg-hover);color:var(--text-normal);user-select:text}
    .illustration-block{display:flex;flex-direction:column;align-items:center;margin:24px 0;padding:12px 0}
    .illustration-block img,.lazy-illustration{max-width:min(560px,100%);max-height:70vh;width:auto;height:auto;border-radius:8px;
      display:block}
    .illustration-caption{margin-top:10px;font-size:13px;font-style:italic;color:var(--text-muted);text-align:center;max-width:420px}
    .illustration-block.illustration-block-attributed{display:flex;flex-direction:row;align-items:flex-start;
      gap:16px;max-width:620px;margin:17px 0;padding:2px 8px}
    .illustration-block.illustration-block-attributed:first-child{margin-top:4px}
    .illustration-block-attributed .message-group-body{flex:1;min-width:0}
    .illustration-attributed-media img,.illustration-attributed-media .lazy-illustration{max-width:min(360px,100%);max-height:50vh;width:auto;height:auto;border-radius:8px;
      display:block;margin-top:2px}
    .illustration-block-attributed .illustration-caption{text-align:left;max-width:360px;margin-left:0}
    /* Placeholder da ilustração ainda não carregada. Quando a imagem já tem
       width/height conhecidos (atributos no <img>), o navegador reserva o
       espaço exato via aspect-ratio automático — sem pulo ao carregar. O
       min-height/width fixos abaixo só valem como fallback (imagens sem
       essa informação salva). */
    .lazy-illustration:not(.is-loaded){background:linear-gradient(135deg,var(--bg-elevated),var(--bg-dark));box-shadow:none}
    .lazy-illustration:not(.is-loaded):not([width]){min-height:220px;width:min(420px,100%)}
    .illustration-attributed-media .lazy-illustration:not(.is-loaded):not([width]){min-height:140px;width:min(260px,100%)}
    .empty-state{margin:auto;text-align:center;color:var(--text-muted)}
    .loading-hint{margin:auto;color:var(--text-faint);font-size:13px}
    .load-more-wrap{display:flex;justify-content:center;padding:16px 0 28px}
    .reader-load-btn{height:32px;padding:0 16px;font-family:inherit;font-size:14px;font-weight:500;line-height:1;background:var(--brand);
      color:#fff;border:none;border-radius:8px;cursor:pointer;transition:background .1s ease}
    .reader-load-btn:hover{background:#4752c4}
    /* Piscadinha de referência ao clicar em "Carregar mais mensagens": marca
       a última mensagem que já estava visível antes do carregamento, pra
       facilitar achar onde a leitura parou mesmo que a tela role um pouco. */
    .reader-load-marker{border-radius:4px;animation:reader-load-marker-fade 1.6s ease}
    @keyframes reader-load-marker-fade{
      0%{background:rgba(88,101,242,0)}
      20%{background:rgba(88,101,242,.15)}
      70%{background:rgba(88,101,242,.15)}
      100%{background:rgba(88,101,242,0)}
    }

    /* --- popup de avatar em zoom (clicar no avatar/nome na leitura) --- */
    .avatar-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;
      justify-content:center;z-index:1000;cursor:default;padding:24px}
    .avatar-lightbox.open{display:flex}
    .avatar-lightbox img{max-width:90vw;max-height:85vh;border-radius:12px;cursor:default}
    .avatar-lightbox-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;
      background:rgba(255,255,255,.12);color:#fff;font-size:18px;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center}
    .avatar-lightbox-close:hover{background:rgba(255,255,255,.24)}

    /* --- hambúrguer e fundo escurecido no mobile --- */
    .mobile-menu-toggle{display:none;width:32px;height:32px;border-radius:6px;background:none;border:none;padding:0;
      color:var(--text-muted);cursor:pointer;align-items:center;justify-content:center;position:absolute;left:8px;top:4px;
      -webkit-tap-highlight-color:transparent;outline:none;user-select:none}
    .mobile-menu-toggle svg{width:20px;height:20px;display:block}
    .mobile-menu-toggle:active{background:var(--bg-hover)}
    @media (hover:hover){.mobile-menu-toggle:hover{background:var(--bg-hover)}}
    /* o fundo escurecido começa ABAIXO da barra do topo (logo + nome do livro) */
    .mobile-backdrop{position:fixed;top:40px;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:19;display:none}
    .mobile-backdrop.open{display:block}
    @media (max-width:860px){
      .mobile-menu-toggle{display:flex}
      #left-sidebar{position:absolute;z-index:20;height:calc(100vh - 40px);height:calc(100dvh - 40px);
        left:-288px;transition:left .15s ease;width:288px;
        /* espaço extra no fim da lista: em celulares com barra de
           gestos/botões do sistema, sem isso o último episódio da lista
           fica parcialmente escondido atrás dela e não dá pra rolar o
           suficiente pra revelar ele por completo. */
        padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px) + 32px)}
      #left-sidebar.mobile-open{left:0}
      body.sidebar-open .mobile-menu-toggle{display:none}
      .reader-messages{padding-bottom:calc(48px + env(safe-area-inset-bottom, 0px) + 32px)}
    }
  </style>
</head>

      <ul class="chapters-list"><li class="loading-hint" style="padding:8px">Carregando…</li></ul>
    </aside>
    <main id="chat-area">
      <div id="channel-header">
        <span class="channel-hash"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M10.99 3.16A1 1 0 1 0 9 2.84L8.15 8H4a1 1 0 0 0 0 2h3.82l-.67 4H3a1 1 0 1 0 0 2h3.82l-.8 4.84a1 1 0 0 0 1.97.32L8.85 16h4.97l-.8 4.84a1 1 0 0 0 1.97.32l.86-5.16H20a1 1 0 1 0 0-2h-3.82l.67-4H21a1 1 0 0 0 0-2h-3.82l.8-4.84a1 1 0 1 0-1.97-.32L15.15 8h-4.97l.8-4.84ZM14.15 14l.67-4H9.85l-.67 4h4.97Z"/></svg></span>
        <span id="channel-title"></span>
        <span id="channel-topic"></span>
      </div>
      <div id="reader-messages" class="reader-messages">
        <div class="loading-hint">Carregando…</div>
      </div>
    </main>
  </div>
</div>
<div id="avatar-lightbox" class="avatar-lightbox">
  <button id="avatar-lightbox-close" class="avatar-lightbox-close" aria-label="Fechar">✕</button>
  <img id="avatar-lightbox-img" src="" alt="">
</div>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
var HASH_SVG = "<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path fill=\"currentColor\" fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M10.99 3.16A1 1 0 1 0 9 2.84L8.15 8H4a1 1 0 0 0 0 2h3.82l-.67 4H3a1 1 0 1 0 0 2h3.82l-.8 4.84a1 1 0 0 0 1.97.32L8.85 16h4.97l-.8 4.84a1 1 0 0 0 1.97.32l.86-5.16H20a1 1 0 1 0 0-2h-3.82l.67-4H21a1 1 0 0 0 0-2h-3.82l.8-4.84a1 1 0 1 0-1.97-.32L15.15 8h-4.97l.8-4.84ZM14.15 14l.67-4H9.85l-.67 4h4.97Z\"/></svg>";
var CHEVRON_SVG = "<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M5.5 9.5 12 16l6.5-6.5\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
var CHAPTERS_INDEX = [];
var CATEGORIES_INDEX = [];
var CHARACTERS_MAP = {};
var episodeCache = {};
var activeChapterId = null;
function getFirstChapterId(){
  var uncategorized = CHAPTERS_INDEX.filter(function(c){ return !c.categoryId; });
  if (uncategorized.length) return uncategorized[0].id;
  for (var i=0;i<CATEGORIES_INDEX.length;i++){
    var inCat = CHAPTERS_INDEX.filter(function(c){ return c.categoryId === CATEGORIES_INDEX[i].id; });
    if (inCat.length) return inCat[0].id;
  }
  return CHAPTERS_INDEX.length ? CHAPTERS_INDEX[0].id : null;
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function initials(name){return name ? name.trim().charAt(0).toUpperCase() : '?';}
function getCharacterById(id){return CHARACTERS_MAP[id] || null;}
function avatarStyle(ch){if(ch&&ch.avatar)return "background-image:url('"+ch.avatar+"');background-color:transparent;";return 'background-color:'+((ch&&ch.color)||'#5865f2')+';';}
function parseFormatting(raw){
  var text = escapeHtml(raw); var placeholders = [];
  function stash(html){ var token = '\u0000'+placeholders.length+'\u0000'; placeholders.push(html); return token; }
  text = text.replace(/```([\s\S]+?)```/g, function(m, code){ var cleaned = code.replace(/^[a-zA-Z0-9_-]*\n/, ''); return stash('<pre class="code-block"><code>'+cleaned+'</code></pre>'); });
  text = text.replace(/`([^`\n]+?)`/g, function(m, code){ return stash('<code class="inline-code">'+code+'</code>'); });
  text = text.replace(/\\([\\*_~`|[\]()])/g, function(m, ch){ return stash(ch); });
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(m,label,url){ return '<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'; });
  text = text.replace(/\|\|([\s\S]+?)\|\|/g, function(m, inner){ return '<span class="spoiler" role="button" tabindex="0" title="Clique para revelar">'+inner+'</span>'; });
  text = text.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__([\s\S]+?)__/g, '<u>$1</u>');
  text = text.replace(/~~([\s\S]+?)~~/g, '<s>$1</s>');
  text = text.replace(/\*([^\n*]+?)\*/g, '<em>$1</em>');
  text = text.replace(/\u0000(\d+)\u0000/g, function(m,i){ return placeholders[Number(i)]; });
  text = text.replace(/-#([^\n]+?)-#/g, '<span class="subtext">$1</span>');
  text = text.replace(/\n/g, '<br>');
  return text;
}
function isEmojiOnlyText(raw){
  if (!raw) return false;
  var stripped = String(raw).replace(/\s+/g, '');
  if (!stripped) return false;
  try {
    var re = new RegExp('^(?:\\p{Extended_Pictographic}\\uFE0F?(?:\\u200D\\p{Extended_Pictographic}\\uFE0F?)*|\\p{Regional_Indicator}{2}|[0-9#*]\\uFE0F?\\u20E3)+$', 'u');
    return re.test(stripped);
  } catch (e) {
    return false;
  }
}
function applyTwemoji(container){
  if (typeof twemoji === 'undefined') return;
  try { twemoji.parse(container, { folder: 'svg', ext: '.svg' }); } catch (e) {}
}
function imgDimAttrs(img){ return (img.width && img.height) ? (' width="'+img.width+'" height="'+img.height+'"') : ''; }
function renderMessagesBatch(messages, visibleN){
  if (!messages || messages.length===0) return '<div class="empty-state">Este episódio ainda está vazio.</div>';
  var total = messages.length;
  var html = renderMessageBlocksHtml(messages.slice(0, visibleN));
  if (visibleN < total) {
    html += '<div class="load-more-wrap"><button type="button" id="btn-reader-load-more" class="reader-load-btn">Carregar mais mensagens ↴</button></div>';
  }
  return html;
}
function renderMessageBlocksHtml(msgs){
  var blocks = [];
  msgs.forEach(function(item){
    if (item.type === 'image'){ blocks.push({kind:'image', item:item}); }
    else {
      var last = blocks[blocks.length-1];
      if (last && last.kind==='group' && last.characterId===item.characterId){ last.lines.push(item); }
      else { blocks.push({kind:'group', characterId:item.characterId, lines:[item]}); }
    }
  });
  var html = '';
  blocks.forEach(function(block){
    if (block.kind === 'image'){
      var img = block.item;
      var speaker = img.speakerId ? getCharacterById(img.speakerId) : null;
      if (speaker) {
        html += '<div class="illustration-block illustration-block-attributed"><div class="message-group-avatar' + (speaker.avatar ? ' zoomable' : '') + '" data-character="'+img.speakerId+'" style="'+avatarStyle(speaker)+'">' + (speaker.avatar ? '' : initials(speaker.name)) + '</div><div class="message-group-body"><div class="message-group-header"><span class="message-author-name' + (speaker.avatar ? ' zoomable' : '') + '" data-character="'+img.speakerId+'" style="color:'+speaker.color+'">'+escapeHtml(speaker.name)+'</span>' + (speaker.tag ? '<span class="message-author-tag">'+escapeHtml(speaker.tag)+'</span>' : '') + '</div><div class="illustration-attributed-media"><img data-full-src="'+escapeHtml(img.url)+'"'+imgDimAttrs(img)+' alt="'+escapeHtml(img.caption||'Ilustração')+'" class="lazy-illustration">' + (img.caption ? '<div class="illustration-caption">'+escapeHtml(img.caption)+'</div>' : '') + '</div></div></div>';
      } else {
        html += '<div class="illustration-block"><img data-full-src="'+escapeHtml(img.url)+'"'+imgDimAttrs(img)+' alt="'+escapeHtml(img.caption||'Ilustração')+'" class="lazy-illustration">' + (img.caption ? '<div class="illustration-caption">'+escapeHtml(img.caption)+'</div>' : '') + '</div>';
      }
    } else {
      var character = getCharacterById(block.characterId);
      var name = character ? character.name : 'Personagem removido';
      var color = character ? character.color : '#949ba4';
      html += '<div class="message-group"><div class="message-group-avatar' + (character && character.avatar ? ' zoomable' : '') + '" data-character="'+block.characterId+'" style="'+avatarStyle(character)+'">' + ((character && character.avatar) ? '' : initials(name)) + '</div><div class="message-group-body"><div class="message-group-header"><span class="message-author-name' + (character && character.avatar ? ' zoomable' : '') + '" data-character="'+block.characterId+'" style="color:'+color+'">'+escapeHtml(name)+'</span>' + ((character && character.tag) ? '<span class="message-author-tag">'+escapeHtml(character.tag)+'</span>' : '') + '</div>';
      block.lines.forEach(function(line){ html += '<div class="message-line"><div class="message-content'+(isEmojiOnlyText(line.content)?' emoji-only':'')+'">'+parseFormatting(line.content)+'</div></div>'; });
      html += '</div></div>';
    }
  });
  return html;
}
function setStatus(msg){ document.getElementById('reader-messages').innerHTML = '<div class="loading-hint">'+msg+'</div>'; }
var READER_BATCH_SIZE = 300;
var visibleCount = READER_BATCH_SIZE;
function loadMoreReaderMessages(){
  var messages = episodeCache[activeChapterId];
  if (!messages) return;
  var container = document.getElementById('reader-messages');
  var oldVisibleCount = visibleCount;
  visibleCount += READER_BATCH_SIZE;
  var oldLoadMoreWrap = container.querySelector('.load-more-wrap');
  var marker = oldLoadMoreWrap ? oldLoadMoreWrap.previousElementSibling : container.lastElementChild;
  if (oldLoadMoreWrap) oldLoadMoreWrap.remove();
  var newSlice = messages.slice(oldVisibleCount, visibleCount);
  var temp = document.createElement('div');
  temp.innerHTML = renderMessageBlocksHtml(newSlice);
  while (temp.firstChild) { container.appendChild(temp.firstChild); }
  if (visibleCount < messages.length) {
    var wrap = document.createElement('div');
    wrap.className = 'load-more-wrap';
    wrap.innerHTML = '<button type="button" id="btn-reader-load-more" class="reader-load-btn">Carregar mais mensagens ↴</button>';
    container.appendChild(wrap);
  }
  wireIllustrationLazyLoad(container);
  applyTwemoji(container);
  if (marker) {
    marker.classList.add('reader-load-marker');
    setTimeout(function(){ marker.classList.remove('reader-load-marker'); }, 1600);
  }
}
var illustrationObserver = null;
var ILLUSTRATION_LOAD_MARGIN = '1200px';
var ILLUSTRATION_UNLOAD_DISTANCE = 3000;
function ensureIllustrationObserver(){
  if (illustrationObserver) return illustrationObserver;
  if (!('IntersectionObserver' in window)) return null;
  var root = document.getElementById('reader-messages');
  illustrationObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var img = entry.target;
      var full = img.dataset.fullSrc;
      if (!full) return;
      if (entry.isIntersecting) {
        if (img.getAttribute('src') !== full) { img.addEventListener('load', function(){ img.classList.add('is-loaded'); }, { once: true }); img.src = full; }
        return;
      }
      var rootRect = entry.rootBounds;
      if (!rootRect) return;
      var rect = entry.boundingClientRect;
      var distance = rect.bottom < rootRect.top ? (rootRect.top - rect.bottom) : (rect.top - rootRect.bottom);
      if (distance > ILLUSTRATION_UNLOAD_DISTANCE && img.hasAttribute('src') && img.hasAttribute('width')) {
        img.removeAttribute('src'); img.classList.remove('is-loaded');
      }
    });
  }, { root: root, rootMargin: ILLUSTRATION_LOAD_MARGIN + ' 0px', threshold: 0 });
  return illustrationObserver;
}
function wireIllustrationLazyLoad(container){
  var observer = ensureIllustrationObserver();
  if (!observer) {
    container.querySelectorAll('img[data-full-src]:not([data-observed])').forEach(function(img){ img.dataset.observed = '1'; img.addEventListener('load', function(){ img.classList.add('is-loaded'); }, { once: true }); img.src = img.dataset.fullSrc; });
    return;
  }
  container.querySelectorAll('img[data-full-src]:not([data-observed])').forEach(function(img){ img.dataset.observed = '1'; observer.observe(img); });
}
function showReaderChapter(id){
  var meta = null;
  for (var i=0;i<CHAPTERS_INDEX.length;i++){ if (CHAPTERS_INDEX[i].id===id){ meta = CHAPTERS_INDEX[i]; break; } }
  if (!meta) return;
  if (activeChapterId && activeChapterId !== id) { delete episodeCache[activeChapterId]; }
  activeChapterId = id;
  visibleCount = READER_BATCH_SIZE;
  document.querySelectorAll('.chapter-item').forEach(function(el){ el.classList.toggle('active', el.dataset.chapter===id); });
  document.getElementById('channel-title').textContent = meta.name;
  document.getElementById('channel-topic').textContent = meta.topic || '';
  closeMobileSidebar();
  if (episodeCache[id]) {
    document.getElementById('reader-messages').innerHTML = renderMessagesBatch(episodeCache[id], visibleCount);
    wireIllustrationLazyLoad(document.getElementById('reader-messages'));
    applyTwemoji(document.getElementById('reader-messages'));
    document.getElementById('reader-messages').scrollTop = 0;
    return;
  }
  setStatus('Carregando episódio…');
  fetch('data/episodes/' + id + '.json')
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){
      (data.characters || []).forEach(function(c){ CHARACTERS_MAP[c.id] = c; });
      episodeCache[id] = data.messages || [];
      if (activeChapterId !== id) return;
      document.getElementById('reader-messages').innerHTML = renderMessagesBatch(episodeCache[id], visibleCount);
      wireIllustrationLazyLoad(document.getElementById('reader-messages'));
      applyTwemoji(document.getElementById('reader-messages'));
      document.getElementById('reader-messages').scrollTop = 0;
    })
    .catch(function(err){
      setStatus('Não foi possível carregar este episódio.');
    });
}
function buildSidebar(){
  var ul = document.querySelector('.chapters-list');
  var html = '';
  var firstId = getFirstChapterId();
  var uncategorized = CHAPTERS_INDEX.filter(function(c){ return !c.categoryId; });
  uncategorized.forEach(function(c){
    html += '<li class="chapter-item'+(c.id===firstId?' active':'')+'" data-chapter="'+c.id+'" title="'+escapeHtml(c.name)+'" onclick="showReaderChapter(\''+c.id+'\')"><span class="chapter-hash">'+HASH_SVG+'</span><span>'+escapeHtml(c.name)+'</span></li>';
  });
  var episodesLabelShown = false;
  CATEGORIES_INDEX.forEach(function(cat){
    var inCat = CHAPTERS_INDEX.filter(function(c){ return c.categoryId === cat.id; });
    if (!inCat.length) return;
    if (!episodesLabelShown) { html += '<li class="episodes-list-label">Epis\u00f3dios</li>'; episodesLabelShown = true; }
    html += '<li class="category-header" data-category="'+cat.id+'"><span>'+escapeHtml(cat.name)+'</span><span class="category-chevron">'+CHEVRON_SVG+'</span></li>';
    inCat.forEach(function(c){
      html += '<li class="chapter-item nested'+(c.id===firstId?' active':'')+'" data-chapter="'+c.id+'" data-category="'+cat.id+'" title="'+escapeHtml(c.name)+'" onclick="showReaderChapter(\''+c.id+'\')"><span class="chapter-hash">'+HASH_SVG+'</span><span>'+escapeHtml(c.name)+'</span></li>';
    });
  });
  ul.innerHTML = html;
}
document.addEventListener('click', function(e){
  var spoiler = e.target.closest('.spoiler');
  if (spoiler) { spoiler.classList.toggle('revealed'); return; }
  if (e.target.closest('#btn-reader-load-more')) { loadMoreReaderMessages(); return; }
  var avatarEl = e.target.closest('.message-group-avatar.zoomable, .message-author-name.zoomable');
  if (avatarEl) { openAvatarLightbox(avatarEl.dataset.character); return; }
});
function openAvatarLightbox(id){
  var ch = getCharacterById(id);
  if (!ch || !ch.avatar) return;
  document.getElementById('avatar-lightbox-img').src = ch.avatar;
  document.getElementById('avatar-lightbox').classList.add('open');
}
function closeAvatarLightbox(){ document.getElementById('avatar-lightbox').classList.remove('open'); }
function openMobileSidebar(){
  document.getElementById('left-sidebar').classList.add('mobile-open');
  document.body.classList.add('sidebar-open');
  document.getElementById('mobile-backdrop').classList.add('open');
}
function closeMobileSidebar(){
  document.getElementById('left-sidebar').classList.remove('mobile-open');
  document.body.classList.remove('sidebar-open');
  document.getElementById('mobile-backdrop').classList.remove('open');
}
document.getElementById('mobile-menu-toggle').addEventListener('click', function(){
  if (document.getElementById('left-sidebar').classList.contains('mobile-open')) closeMobileSidebar(); else openMobileSidebar();
});
document.getElementById('mobile-backdrop').addEventListener('click', closeMobileSidebar);
document.getElementById('avatar-lightbox-close').addEventListener('click', closeAvatarLightbox);
document.getElementById('avatar-lightbox').addEventListener('click', function(e){ if (e.target.id === 'avatar-lightbox') closeAvatarLightbox(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeAvatarLightbox(); });
fetch('data/chapters-index.json')
  .then(function(r){ return r.json(); })
  .then(function(index){
    CHAPTERS_INDEX = index.chapters || [];
    CATEGORIES_INDEX = index.categories || [];
    buildSidebar();
    var firstId = getFirstChapterId();
    if (firstId) showReaderChapter(firstId);
    else setStatus('Este livro ainda não tem episódios.');
    if (window.matchMedia && window.matchMedia('(max-width:860px)').matches) { openMobileSidebar(); }
  }).catch(function(err){
    setStatus('Não foi possível carregar o índice do livro (' + err.message + '). Abra este site via http(s) (ex: GitHub Pages), não direto do disco (file://).');
  });
</script>
